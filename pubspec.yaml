name: test_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.5
  visibility_detector: ^0.4.0+2
  file_picker: ^8.3.7
  photo_manager: ^3.6.0
  video_thumbnail: ^0.5.6
  http: ^1.2.2
  apivideo_live_stream: ^1.2.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  dio: ^5.8.0+1
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.1
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  equatable: ^2.0.7
  go_router: ^14.8.1
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  uuid: ^4.5.3
  logger: ^2.5.0
  iconsax_plus: ^1.0.0
  flutter_svg: ^2.0.17
  connectivity_plus: ^7.3.1
  sizing: ^2.0.1
  country_flags: ^4.1.2
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

  fonts:
    # UI typeface — everything except the two cases below.
    - family: Satoshi
      fonts:
        - asset: fonts/Satoshi-Light.otf
          weight: 300
        - asset: fonts/Satoshi-Regular.otf
          weight: 400
        - asset: fonts/Satoshi-Medium.otf
          weight: 500
        - asset: fonts/Satoshi-Bold.otf
          weight: 700
        - asset: fonts/Satoshi-Black.otf
          weight: 900

    # Welcome carousel + typewriter. The 18pt cut covers the 11-24px range used.
    - family: Inter
      fonts:
        - asset: fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter_18pt-Bold.ttf
          weight: 700
        # Variable italic (wght 100-900, opsz 14-32); AppStyles drives both axes.
        - asset: fonts/Inter-Italic-VariableFont.ttf
          style: italic

    # One-time-code numerals only.
    - family: Red Hat Text
      fonts:
        - asset: fonts/RedHatText-Medium.ttf
          weight: 500
